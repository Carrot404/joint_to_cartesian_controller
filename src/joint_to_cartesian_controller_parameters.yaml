joint_to_cartesian_controller:
  tf_prefix: {
    type: string,
    default_value: "",
    description: "URDF tf prefix"
  }
  robot_base_link: {
    type: string,
    default_value: "base_link",
    description: "Cartesian pose/twist base link"
  }
  end_effector_link: {
    type: string,
    default_value: "tool0",
    description: "Cartesian pose/twist end_effector link"
  }
  pose_pub_name: {
    type: string,
    default_value: "~/current_pose",
    description: "Pose topic name that will be published"
  }
  twist_pub_name: {
    type: string,
    default_value: "~/current_twist",
    description: "Twist topic name that will be published"
  }
  joints: {
    type: string_array,
    default_value: [],
    description: "joints in chain from base_link to end_effector_link"
  }
  state_interfaces: {
    type: string_array,
    default_value: [],
    description: "state interface"
  }
  twist_filter: {
    enable: {
      type: bool,
      default_value: false,
      description: "Enable One Euro Filter for cartesian velocity smoothing"
    },
    freq: {
      type: double,
      default_value: 125.0,
      description: "Controller update frequency in Hz (used for One Euro Filter)"
    },
    min_cutoff: {
      type: double,
      default_value: 1.0,
      description: "One Euro Filter minimum cutoff frequency in Hz (lower = more smoothing)"
    },
    beta: {
      type: double,
      default_value: 0.007,
      description: "One Euro Filter speed coefficient (higher = more responsive to velocity changes)"
    },
    d_cutoff: {
      type: double,
      default_value: 1.0,
      description: "One Euro Filter derivative cutoff frequency in Hz"
    }
  }
